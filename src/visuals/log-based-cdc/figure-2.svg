<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 640" width="1160" height="640" role="img" aria-labelledby="cdc-f2-title cdc-f2-desc" font-family="'Atkinson Hyperlegible Next Variable', system-ui, sans-serif" fill="#1c1b19">
<title id="cdc-f2-title">Failure and recovery: duplicates after a restart, and convergence through a position-guarded merge</title>
<desc id="cdc-f2-desc">The source log holds five changes at positions 101 to 105 for keys A and B. Batch 1 delivers 101 to 103. The capture restarts and resumes after its last committed offset at 101, so batch 2 delivers 102 and 103 again with 104 and 105. A later replay, batch 3, delivers 102 and 103 only. Run 1 applies A at 102 and B at 103. Run 2 keeps the latest change per key, so the duplicates lose inside the batch, and applies A at 104 and B at 105 because both are newer than the stored positions; re-running it changes nothing. Run 3 keeps A at 102 and B at 103, both older than the stored 104 and 105, so the guard skips them and B stays deleted. The current-state table ends with A equal to v3 and B soft-deleted, matching the source, and stays that way. If the recorded position has left the log, a new snapshot is needed and the target must be rebuilt or reconciled against it.</desc>

<defs>
  <marker id="cdc-f2-head-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1e3a5f"/></marker>
  <marker id="cdc-f2-head-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9a4a1f"/></marker>
  <marker id="cdc-f2-head-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4f4a44" stroke-width="1.5"/></marker>
  <marker id="cdc-f2-dot-meta" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"><circle cx="5" cy="5" r="4" fill="#2f6b66"/></marker>
</defs>
<line x1="16" y1="22" x2="1144" y2="22" stroke="#b9ab94" stroke-width="1"/><text x="16" y="44" class="n" font-size="15">Source transaction log</text><text x="236" y="44" class="s" font-size="13">committed changes, in log order</text>
<rect x="16" y="56" width="112" height="52" rx="4" fill="#e7ecf2" stroke="#1e3a5f" stroke-width="1.5"/><text x="26" y="76" class="e" font-size="12">pos 101</text><text x="26" y="96" class="s" font-size="13">insert A = v1</text>
<rect x="138" y="56" width="112" height="52" rx="4" fill="#e7ecf2" stroke="#1e3a5f" stroke-width="1.5"/><text x="148" y="76" class="e" font-size="12">pos 102</text><text x="148" y="96" class="s" font-size="13">update A = v2</text>
<rect x="260" y="56" width="112" height="52" rx="4" fill="#e7ecf2" stroke="#1e3a5f" stroke-width="1.5"/><text x="270" y="76" class="e" font-size="12">pos 103</text><text x="270" y="96" class="s" font-size="13">insert B = v1</text>
<rect x="382" y="56" width="112" height="52" rx="4" fill="#e7ecf2" stroke="#1e3a5f" stroke-width="1.5"/><text x="392" y="76" class="e" font-size="12">pos 104</text><text x="392" y="96" class="s" font-size="13">update A = v3</text>
<rect x="504" y="56" width="112" height="52" rx="4" fill="#e7ecf2" stroke="#1e3a5f" stroke-width="1.5"/><text x="514" y="76" class="e" font-size="12">pos 105</text><text x="514" y="96" class="s" font-size="13" fill="#7a3915" font-weight="700">delete B</text>
<text x="634" y="78" class="s" font-size="12">pos = log position (PostgreSQL LSN, or</text>
<text x="634" y="94" class="s" font-size="12">MySQL binlog file + position + row)</text>
<line x1="16" y1="128" x2="1144" y2="128" stroke="#b9ab94" stroke-width="1"/><text x="16" y="150" class="n" font-size="15">Delivered to landing</text><text x="236" y="150" class="s" font-size="13">append-only, so duplicates are kept</text>
<rect x="16" y="164" width="112" height="52" rx="4" fill="#e7ecf2" stroke="#1e3a5f" stroke-width="1.5"/><text x="26" y="184" class="e" font-size="12">pos 101</text><text x="26" y="204" class="s" font-size="13">insert A = v1</text>
<rect x="138" y="164" width="112" height="52" rx="4" fill="#e7ecf2" stroke="#1e3a5f" stroke-width="1.5"/><text x="148" y="184" class="e" font-size="12">pos 102</text><text x="148" y="204" class="s" font-size="13">update A = v2</text>
<rect x="260" y="164" width="112" height="52" rx="4" fill="#e7ecf2" stroke="#1e3a5f" stroke-width="1.5"/><text x="270" y="184" class="e" font-size="12">pos 103</text><text x="270" y="204" class="s" font-size="13">insert B = v1</text>
<line x1="382" y1="158" x2="382" y2="222" stroke="#9a4a1f" stroke-width="2.5"/>
<rect x="372" y="226" width="20" height="20" rx="3" fill="#9a4a1f"/><text x="382" y="240.5" class="tnum" font-size="12" text-anchor="middle" fill="#fffdf8" font-weight="700">1</text>
<rect x="392" y="164" width="112" height="52" rx="4" fill="#f4e6da" stroke="#9a4a1f" stroke-width="1.5" stroke-dasharray="5 3"/><text x="402" y="184" class="e" font-size="12">pos 102</text><text x="402" y="204" class="s" font-size="13">update A = v2</text>
<rect x="514" y="164" width="112" height="52" rx="4" fill="#f4e6da" stroke="#9a4a1f" stroke-width="1.5" stroke-dasharray="5 3"/><text x="524" y="184" class="e" font-size="12">pos 103</text><text x="524" y="204" class="s" font-size="13">insert B = v1</text>
<rect x="636" y="164" width="112" height="52" rx="4" fill="#e7ecf2" stroke="#1e3a5f" stroke-width="1.5"/><text x="646" y="184" class="e" font-size="12">pos 104</text><text x="646" y="204" class="s" font-size="13">update A = v3</text>
<rect x="758" y="164" width="112" height="52" rx="4" fill="#e7ecf2" stroke="#1e3a5f" stroke-width="1.5"/><text x="768" y="184" class="e" font-size="12">pos 105</text><text x="768" y="204" class="s" font-size="13" fill="#7a3915" font-weight="700">delete B</text>
<line x1="880" y1="158" x2="880" y2="222" stroke="#9a4a1f" stroke-width="2.5"/>
<rect x="870" y="226" width="20" height="20" rx="3" fill="#9a4a1f"/><text x="880" y="240.5" class="tnum" font-size="12" text-anchor="middle" fill="#fffdf8" font-weight="700">5</text>
<rect x="890" y="164" width="112" height="52" rx="4" fill="#f4e6da" stroke="#9a4a1f" stroke-width="1.5" stroke-dasharray="5 3"/><text x="900" y="184" class="e" font-size="12">pos 102</text><text x="900" y="204" class="s" font-size="13">update A = v2</text>
<rect x="1012" y="164" width="112" height="52" rx="4" fill="#f4e6da" stroke="#9a4a1f" stroke-width="1.5" stroke-dasharray="5 3"/><text x="1022" y="184" class="e" font-size="12">pos 103</text><text x="1022" y="204" class="s" font-size="13">insert B = v1</text>
<path d="M16 220 V226 H372 V220" fill="none" stroke="#4f4a44" stroke-width="1"/>
<path d="M392 220 V226 H870 V220" fill="none" stroke="#4f4a44" stroke-width="1"/>
<path d="M890 220 V226 H1124 V220" fill="none" stroke="#4f4a44" stroke-width="1"/>
<text x="16" y="246" class="e" font-size="12">batch 1</text>
<text x="400" y="246" class="e" font-size="12" fill="#7a3915">batch 2: capture restarted and resumed after its last</text>
<text x="400" y="262" class="e" font-size="12" fill="#7a3915">committed offset (pos 101), so 102 and 103 arrive again</text>
<text x="898" y="246" class="e" font-size="12" fill="#7a3915">batch 3: a later replay</text>
<text x="898" y="262" class="e" font-size="12" fill="#7a3915">of 102 and 103 only</text>
<line x1="16" y1="290" x2="1144" y2="290" stroke="#b9ab94" stroke-width="1"/><text x="16" y="312" class="n" font-size="15">Deduplicate, then MERGE</text><text x="236" y="312" class="s" font-size="13">latest per key by log position; apply only if newer</text>
<path d="M218 232 L218 326" fill="none" stroke="#1e3a5f" stroke-width="2" marker-end="url(#cdc-f2-head-data)"/>
<rect x="16" y="328" width="356" height="104" rx="6" fill="#fffdf8" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="28" y="350" class="k" font-size="12">RUN 1</text>
<text x="28" y="370" class="s" font-size="13">Latest per key: A 102, B 103.</text>
<text x="28" y="388" class="s" font-size="13">No stored positions yet, so</text>
<text x="28" y="406" class="s" font-size="13">both are applied.</text>
<path d="M818 232 L818 326" fill="none" stroke="#1e3a5f" stroke-width="2" marker-end="url(#cdc-f2-head-data)"/>
<rect x="392" y="328" width="478" height="104" rx="6" fill="#fffdf8" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="404" y="350" class="k" font-size="12">RUN 2</text>
<rect x="814" y="336" width="20" height="20" rx="3" fill="#9a4a1f"/><text x="824" y="350.5" class="tnum" font-size="12" text-anchor="middle" fill="#fffdf8" font-weight="700">2</text>
<rect x="840" y="336" width="20" height="20" rx="3" fill="#9a4a1f"/><text x="850" y="350.5" class="tnum" font-size="12" text-anchor="middle" fill="#fffdf8" font-weight="700">3</text>
<text x="404" y="370" class="s" font-size="13">Latest per key: A 104, B 105, so the duplicate rows</text>
<text x="404" y="388" class="s" font-size="13">for 102 and 103 lose inside the batch. Both are newer</text>
<text x="404" y="406" class="s" font-size="13">than the stored 102 and 103, so both are applied.</text>
<text x="404" y="424" class="s" font-size="13" font-weight="700">Re-running run 2 changes nothing.</text>
<path d="M1124 232 L1124 326" fill="none" stroke="#9a4a1f" stroke-width="2.5" marker-end="url(#cdc-f2-head-hi)"/>
<rect x="890" y="328" width="254" height="104" rx="6" fill="#f4e6da" stroke="#9a4a1f" stroke-width="1.5"/>
<text x="902" y="350" class="k" font-size="12">RUN 3</text>
<rect x="950" y="336" width="20" height="20" rx="3" fill="#9a4a1f"/><text x="960" y="350.5" class="tnum" font-size="12" text-anchor="middle" fill="#fffdf8" font-weight="700">6</text>
<text x="902" y="370" class="s" font-size="13">Latest per key: A 102, B 103.</text>
<text x="902" y="388" class="s" font-size="13">Both are older than the stored</text>
<text x="902" y="406" class="s" font-size="13">104 and 105, so both are skipped.</text>
<text x="902" y="424" class="s" font-size="13" font-weight="700">B stays deleted.</text>
<line x1="16" y1="454" x2="1144" y2="454" stroke="#b9ab94" stroke-width="1"/><text x="16" y="476" class="n" font-size="15">Current-state table</text><text x="236" y="476" class="s" font-size="13">key, value, stored log position</text>
<path d="M218 432 L218 488" fill="none" stroke="#1e3a5f" stroke-width="2" marker-end="url(#cdc-f2-head-data)"/>
<rect x="16" y="490" width="356" height="64" rx="6" fill="#e3efec" stroke="#2f6b66" stroke-width="1.5"/>
<text x="28" y="514" class="k" font-size="12">After run 1</text>
<text x="28" y="536" class="s" font-size="13">A = v2 (102) · B = v1 (103)</text>
<path d="M818 432 L818 488" fill="none" stroke="#1e3a5f" stroke-width="2" marker-end="url(#cdc-f2-head-data)"/>
<rect x="392" y="490" width="478" height="64" rx="6" fill="#e3efec" stroke="#2f6b66" stroke-width="1.5"/>
<text x="404" y="514" class="k" font-size="12">After run 2: matches the source log</text>
<rect x="840" y="498" width="20" height="20" rx="3" fill="#9a4a1f"/><text x="850" y="512.5" class="tnum" font-size="12" text-anchor="middle" fill="#fffdf8" font-weight="700">4</text>
<text x="404" y="536" class="s" font-size="13">A = v3 (104) · B deleted, kept as a soft delete (105)</text>
<path d="M1124 432 L1124 488" fill="none" stroke="#9a4a1f" stroke-width="2.5" marker-end="url(#cdc-f2-head-hi)"/>
<rect x="890" y="490" width="254" height="64" rx="6" fill="#e3efec" stroke="#2f6b66" stroke-width="1.5"/>
<text x="902" y="514" class="k" font-size="12">After run 3: unchanged</text>
<text x="902" y="536" class="s" font-size="13">A = v3 (104) · B deleted (105)</text>
<line x1="16" y1="574" x2="1144" y2="574" stroke="#b9ab94" stroke-width="1"/>
<rect x="16" y="588" width="4" height="40" fill="#9a4a1f"/>
<text x="28" y="604" class="s" font-size="13" fill="#7a3915" font-weight="700">If the recorded position is no longer in the log (WAL removed past a slot limit, or binlog expired), capture cannot resume from it.</text>
<text x="28" y="622" class="s" font-size="13" fill="#7a3915" font-weight="700">Take a new snapshot, then rebuild or reconcile the target against it: a snapshot holds only rows that still exist.</text>
</svg>
