<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 536" width="1160" height="536" role="img" aria-labelledby="cdc-f1-title cdc-f1-desc" font-family="'Atkinson Hyperlegible Next Variable', system-ui, sans-serif" fill="#1c1b19">
<title id="cdc-f1-title">Reference blueprint: log-based change data capture into an analytical warehouse</title>
<desc id="cdc-f1-desc">An operational database writes changes to its transaction log. A CDC capture process snapshots the tables, then streams changes from the recorded log position and keeps its own offset; on PostgreSQL it also confirms its position to a replication slot, which keeps the WAL capture may still need. Changes go to a change event log or change files, then are loaded append-only into a landing table. The latest change per key by log position is merged into current-state tables, which store each key with its log position, apply only newer changes and keep deletes as soft deletes. Consumers read the current-state tables. An orchestrator triggers each run; monitoring watches capture lag, load lag and retention; reconciliation compares source and target totals. Duplicates are possible, so the warehouse side must tolerate them.</desc>

