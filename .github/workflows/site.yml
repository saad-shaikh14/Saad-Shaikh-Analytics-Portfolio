name: Site

# One workflow: every pull request, and every push to `main`, builds and verifies the site; only `main` deploys.
# There is no schedule and no other workflow that publishes to Pages.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies (lockfile only)
        run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Internal links
        run: npm run test:links
      - name: Publication safety scan (whole repository and build output)
        # The private-name list lives only in this secret, never in the repository. The scan reports rule numbers,
        # never patterns. It must be present for pushes and same-repository pull requests; fork pull requests
        # cannot read secrets, so they run the generic checks only.
        env:
          CONTENT_DENYLIST: ${{ secrets.CONTENT_DENYLIST }}
          REQUIRE_DENYLIST: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: npm run test:content
      - name: Palette contrast, including figure text (axe does not check SVG text)
        run: npm run test:contrast
      - name: Install browser for tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests (routes, accessibility, reflow, legacy URLs)
        run: npx playwright test
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
          retention-days: 30

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
